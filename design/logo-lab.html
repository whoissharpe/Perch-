<title>Perch mark studies</title>
<style>
  :root { --paper:#F2F0E9; --pine:#12271F; --blaze:#F1622B; }
  body { background:var(--paper); color:var(--pine); font-family:system-ui; margin:0; padding:40px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:28px; }
  figure { margin:0; background:#fff; border:1px solid #0002; border-radius:14px; padding:20px; }
  figcaption { font:11px/1.4 ui-monospace,monospace; letter-spacing:.1em; text-transform:uppercase; color:#0008; margin-top:14px; }
  .big { width:150px; height:150px; color:var(--pine); }
  .row { display:flex; align-items:center; gap:16px; margin-top:14px; border-top:1px solid #0001; padding-top:14px; }
  .sm { width:30px; height:30px; }
  .xs { width:17px; height:17px; }
  .wm { font:600 21px/1 system-ui; letter-spacing:-.02em; }
  .dark { background:var(--pine); color:var(--paper); }
  .blaze { color:var(--blaze); }
</style>

<div class="grid">

  <!-- A: chunky woodcut songbird on a bench rail -->
  <figure>
    <svg class="big" viewBox="0 0 48 48" fill="none"><g fill="currentColor">
      <ellipse cx="23" cy="23" rx="11.5" ry="9.5" transform="rotate(-18 23 23)"/>
      <circle cx="32.5" cy="15.5" r="6.2"/>
      <path d="M38 13.6 L46.5 16.2 L38 19.2 Z"/>
      <path d="M14.5 27.5 L2.5 33.5 L6 24.5 Z"/>
      <rect x="21.5" y="30" width="1.8" height="6.5" rx=".9"/>
      <rect x="27" y="29.5" width="1.8" height="7" rx=".9"/>
      <rect x="3" y="35.5" width="42" height="2.6" rx="1.3"/>
      <rect x="8" y="38" width="2.2" height="7" rx="1.1"/>
      <rect x="37.8" y="38" width="2.2" height="7" rx="1.1"/>
    </g><circle cx="34" cy="14.5" r="1.5" fill="var(--paper)"/></svg>
    <div class="row"><svg class="sm" viewBox="0 0 48 48"><g fill="currentColor"><ellipse cx="23" cy="23" rx="11.5" ry="9.5" transform="rotate(-18 23 23)"/><circle cx="32.5" cy="15.5" r="6.2"/><path d="M38 13.6 L46.5 16.2 L38 19.2 Z"/><path d="M14.5 27.5 L2.5 33.5 L6 24.5 Z"/><rect x="21.5" y="30" width="1.8" height="6.5" rx=".9"/><rect x="27" y="29.5" width="1.8" height="7" rx=".9"/><rect x="3" y="35.5" width="42" height="2.6" rx="1.3"/><rect x="8" y="38" width="2.2" height="7" rx="1.1"/><rect x="37.8" y="38" width="2.2" height="7" rx="1.1"/></g></svg>
      <svg class="xs" viewBox="0 0 48 48"><g fill="currentColor"><ellipse cx="23" cy="23" rx="11.5" ry="9.5" transform="rotate(-18 23 23)"/><circle cx="32.5" cy="15.5" r="6.2"/><path d="M38 13.6 L46.5 16.2 L38 19.2 Z"/><path d="M14.5 27.5 L2.5 33.5 L6 24.5 Z"/><rect x="3" y="35.5" width="42" height="2.6" rx="1.3"/></g></svg>
      <span class="wm">Perch</span></div>
    <figcaption>A — woodcut songbird, bench rail</figcaption>
  </figure>

  <!-- B: bird on rail, tail up (wren posture) -->
  <figure>
    <svg class="big" viewBox="0 0 48 48"><g fill="currentColor">
      <ellipse cx="24" cy="24" rx="10.5" ry="9" transform="rotate(12 24 24)"/>
      <circle cx="32" cy="16.5" r="6"/>
      <path d="M37.4 14.8 L45.5 17 L37.4 20 Z"/>
      <path d="M15.5 21 L6 8.5 L10.5 20.5 Z"/>
      <rect x="22" y="31" width="1.8" height="5.5" rx=".9"/>
      <rect x="27.5" y="31" width="1.8" height="5.5" rx=".9"/>
      <rect x="3" y="35.5" width="42" height="2.6" rx="1.3"/>
      <rect x="8" y="38" width="2.2" height="7" rx="1.1"/>
      <rect x="37.8" y="38" width="2.2" height="7" rx="1.1"/>
    </g><circle cx="33.4" cy="15.6" r="1.45" fill="var(--paper)"/></svg>
    <figcaption>B — wren, tail cocked up</figcaption>
  </figure>

  <!-- C: bird perched on a contour line -->
  <figure>
    <svg class="big" viewBox="0 0 48 48"><g fill="currentColor">
      <ellipse cx="23" cy="21" rx="10.5" ry="8.8" transform="rotate(-16 23 21)"/>
      <circle cx="31.8" cy="14" r="5.8"/>
      <path d="M37.2 12.2 L45.2 14.6 L37.2 17.5 Z"/>
      <path d="M14.5 25.5 L3 31 L6.5 22.5 Z"/>
      <rect x="21.5" y="28" width="1.7" height="6" rx=".85"/>
      <rect x="27" y="27.5" width="1.7" height="6.5" rx=".85"/>
      </g>
      <path d="M2 34 C10 34 12 37 20 37 C30 37 32 33 46 33" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M2 41 C12 41 14 44 24 44 C34 44 38 40 46 40" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".45"/>
      <circle cx="33.2" cy="13.1" r="1.4" fill="var(--paper)"/></svg>
    <figcaption>C — perched on a topo contour</figcaption>
  </figure>

  <!-- D: map pin whose negative space is a bird -->
  <figure>
    <svg class="big" viewBox="0 0 48 48">
      <path d="M24 3 C15.2 3 8 10.2 8 19 C8 30.5 24 45 24 45 C24 45 40 30.5 40 19 C40 10.2 32.8 3 24 3 Z" fill="currentColor"/>
      <g fill="var(--paper)">
        <ellipse cx="23" cy="19.5" rx="7.2" ry="6" transform="rotate(-18 23 19.5)"/>
        <circle cx="28.8" cy="14.6" r="3.9"/>
        <path d="M32.2 13.4 L37.6 15 L32.2 17 Z"/>
        <path d="M17.6 22.5 L10 26.5 L12.4 20.5 Z"/>
        <rect x="21.6" y="24" width="1.2" height="4" rx=".6"/>
        <rect x="25.4" y="23.6" width="1.2" height="4.4" rx=".6"/>
        <rect x="13" y="27.5" width="22" height="1.8" rx=".9"/>
      </g>
      <circle cx="29.8" cy="14" r=".95" fill="currentColor"/>
    </svg>
    <figcaption>D — pin, bird cut out</figcaption>
  </figure>

  <!-- E: literal bench with backrest + bird -->
  <figure>
    <svg class="big" viewBox="0 0 48 48"><g fill="currentColor">
      <ellipse cx="15" cy="17" rx="8" ry="6.8" transform="rotate(-18 15 17)"/>
      <circle cx="21.6" cy="11.5" r="4.6"/>
      <path d="M25.8 10.2 L32 12.2 L25.8 14.4 Z"/>
      <path d="M8.5 20.5 L1 25 L3.6 18.5 Z"/>
      <rect x="13.6" y="22" width="1.4" height="5" rx=".7"/>
      <rect x="18" y="21.6" width="1.4" height="5.4" rx=".7"/>
      <rect x="4" y="26.5" width="40" height="2.4" rx="1.2"/>
      <rect x="4" y="31.5" width="40" height="2.4" rx="1.2"/>
      <rect x="7" y="34" width="2.2" height="9" rx="1.1"/>
      <rect x="38.8" y="34" width="2.2" height="9" rx="1.1"/>
      <rect x="6" y="37.5" width="36" height="1.6" rx=".8"/>
    </g><circle cx="22.8" cy="10.8" r="1.1" fill="var(--paper)"/></svg>
    <figcaption>E — bird on an actual bench</figcaption>
  </figure>

  <!-- F: dark + blaze test of the leading candidate -->
  <figure class="dark">
    <svg class="big blaze" viewBox="0 0 48 48"><g fill="currentColor">
      <ellipse cx="23" cy="23" rx="11.5" ry="9.5" transform="rotate(-18 23 23)"/>
      <circle cx="32.5" cy="15.5" r="6.2"/>
      <path d="M38 13.6 L46.5 16.2 L38 19.2 Z"/>
      <path d="M14.5 27.5 L2.5 33.5 L6 24.5 Z"/>
      <rect x="21.5" y="30" width="1.8" height="6.5" rx=".9"/>
      <rect x="27" y="29.5" width="1.8" height="7" rx=".9"/>
      <rect x="3" y="35.5" width="42" height="2.6" rx="1.3"/>
      <rect x="8" y="38" width="2.2" height="7" rx="1.1"/>
      <rect x="37.8" y="38" width="2.2" height="7" rx="1.1"/>
    </g><circle cx="34" cy="14.5" r="1.5" fill="var(--pine)"/></svg>
    <figcaption style="color:#fff8">F — A on pine, blaze fill</figcaption>
  </figure>

</div>
